<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Skill Gap Analyzer</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: #161b22; padding: 30px; border-radius: 10px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; font-size: 24px; margin-top: 0; text-align: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 14px; }
        select, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        .btn { background: #238636; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        .btn:hover { background: #2ea043; }
        .results-box { margin-top: 25px; padding: 20px; background: #0d1117; border-radius: 6px; border: 1px solid #30363d; display: none; }
        .score { font-size: 20px; font-weight: bold; color: #238636; margin: 10px 0; }
        .missing-list { color: #f85149; padding-left: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 AI Job Skill Gap Analyzer</h1>
    <p style="text-align: center; color: #8b949e;">Identify missing core competencies instantly.</p>

    <label for="jobRole">1. Select Target Career Role</label>
    <select id="jobRole">
        <option value="Python Developer">Python Developer</option>
        <option value="Data Analyst">Data Analyst</option>
        <option value="Web Developer">Web Developer</option>
    </select>

    <label for="userSkills">2. Enter Your Current Skills (Comma Separated)</label>
    <textarea id="userSkills" placeholder="e.g., sql, excel, html, git"></textarea>

    <button class="btn" onclick="runAnalysis()">Run Gap Analysis</button>

    <div id="results" class="results-box">
        <div style="font-weight: bold; font-size: 16px;">Analysis Report:</div>
        <div class="score" id="matchScore">Match Score: 0%</div>
        <div style="font-weight: bold; margin-bottom: 5px;">Skills You Need to Learn:</div>
        <ul class="missing-list" id="missingSkills"></ul>
    </div>
</div>

<script>
    function runAnalysis() {
        const role = document.getElementById('jobRole').value;
        const inputSkills = document.getElementById('userSkills').value.toLowerCase();
        
        // Split input into array and clean white spaces
        const userSkillsArray = inputSkills.split(',').map(s => s.trim()).filter(s => s.length > 0);

        // Core Matrix mirroring our SQL / Python database logic
        const matrix = {
            'Python Developer': ['python', 'django', 'flask', 'sql', 'git', 'docker', 'rest api'],
            'Data Analyst': ['sql', 'excel', 'python', 'pandas', 'tableau', 'power bi', 'statistics'],
            'Web Developer': ['html', 'css', 'javascript', 'react', 'node.js', 'git', 'mongodb']
        };

        const requiredSkills = matrix[role];
        const missing = requiredSkills.filter(skill => !userSkillsArray.includes(skill));
        
        // Calculate dynamic mathematical match ratio
        const score = Math.round(((requiredSkills.length - missing.length) / requiredSkills.length) * 100);

        // Render data elements onto screen container
        document.getElementById('matchScore').innerText = `Match Score: ${score}%`;
        const listContainer = document.getElementById('missingSkills');
        listContainer.innerHTML = '';

        if(missing.length === 0) {
            listContainer.innerHTML = '<li style="color: #238636;">Perfect Match! You have all core skills.</li>';
        } else {
            missing.forEach(skill => {
                const li = document.createElement('li');
                li.innerText = skill;
                listContainer.appendChild(li);
            });
        }

        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
